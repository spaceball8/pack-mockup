document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

886b9\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"e9040930-94d6-49e9-a904-0671d6de18ca\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ---- Color (monochrome) ---- */\n  --ink:        #000000;   /* primary ink \u2014 true black */\n  --paper:     #FFFFFF;    /* primary paper \u2014 true white */\n  --ink-90:    #1A1A1A;    /* near-black, used for layered surfaces on paper */\n  --ink-60:    #595959;    /* muted text on paper */\n  --ink-40:    #8C8C8C;    /* hint text */\n  --ink-20:    #CFCFCF;    /* dividers / hairlines on paper */\n  --ink-08:    #ECECEC;    /* subtle wash on paper */\n\n  --paper-90:  #F5F5F5;    /* off-white surface */\n  --paper-60:  #B3B3B3;    /* muted text on ink */\n  --paper-40:  #7A7A7A;    /* hint text on ink */\n  --paper-20:  #3D3D3D;    /* dividers / hairlines on ink */\n\n  /* ---- Semantic (still monochrome \u2014 meaning is carried by weight/scale, not hue) ---- */\n  --fg:                var(--ink);\n  --fg-muted:          var(--ink-60);\n  --fg-hint:           var(--ink-40);\n  --bg:                var(--paper);\n  --bg-alt:            var(--paper-90);\n  --hairline:          var(--ink-20);\n  --accent:            var(--ink);     /* there is no second colour \u2014 emphasis is bold + italic, not hue */\n\n  /* On ink surfaces, flip the variables: */\n  --fg-on-ink:         var(--paper);\n  --fg-muted-on-ink:   var(--paper-60);\n  --hairline-on-ink:   var(--paper-20);\n\n  /* ---- Typography ---- */\n  --font-display: \"Bricolage Grotesque\", \"S\u00f6hne\", \"Inter Tight\", system-ui, sans-serif;\n  --font-body:    \"Bricolage Grotesque\", \"S\u00f6hne\", \"Inter Tight\", system-ui, sans-serif;\n  --font-mono:    \"JetBrains Mono\", ui-monospace, Menlo, monospace;\n\n  /* Type scale \u2014 display-led. Sharp Sharp leans HARD on huge headlines. */\n  --fs-display-xl: clamp(72px, 12vw, 200px);  /* hero / cover posters */\n  --fs-display-l:  clamp(56px, 8vw,  128px);\n  --fs-display-m:  clamp(40px, 6vw,  88px);\n  --fs-h1:         clamp(36px, 4.5vw, 64px);\n  --fs-h2:         clamp(28px, 3vw,  44px);\n  --fs-h3:         22px;\n  --fs-lead:       20px;\n  --fs-body:       17px;\n  --fs-small:      14px;\n  --fs-caption:    12px;\n\n  --lh-display:    0.92;\n  --lh-tight:      1.05;\n  --lh-snug:       1.2;\n  --lh-body:       1.45;\n\n  --tracking-tight: -0.03em;\n  --tracking-snug:  -0.015em;\n  --tracking-wide:   0.08em;\n\n  /* ---- Layout ---- */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  24px;\n  --space-6:  32px;\n  --space-7:  48px;\n  --space-8:  64px;\n  --space-9:  96px;\n  --space-10: 128px;\n\n  --radius-none: 0;\n  --radius-sm:   2px;\n  --radius-md:   4px;\n  --radius-pill: 999px;\n  /* Sharp Sharp UI defaults to hard 0-radius corners. Pills are\n     used selectively for stat badges and CTAs. */\n\n  --hairline-w:  1px;\n  --border-w:    2px;\n  --rule-w:      3px;     /* the thick separator line used in posters */\n\n  /* ---- Motion ---- */\n  --ease-out:   cubic-bezier(0.22, 1, 0.36, 1);   /* the \"house\" easing \u2014 quick out, soft land */\n  --ease-in:    cubic-bezier(0.55, 0, 1, 0.45);\n  --ease-snap:  cubic-bezier(0.7, 0, 0.3, 1);     /* used for emphasis / type reveals */\n  --t-fast:     120ms;\n  --t-med:      240ms;\n  --t-slow:     480ms;\n}\n\n/* ----- Element defaults --------------------------------------- */\nhtml, body {\n  background: var(--bg);\n  color: var(--fg);\n  font-family: var(--font-body);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  font-feature-settings: \"ss01\", \"cv11\";\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, .h1 {\n  font-family: var(--font-display);\n  font-size: var(--fs-h1);\n  font-weight: 700;\n  line-height: var(--lh-tight);\n  letter-spacing: var(--tracking-tight);\n  margin: 0;\n}\nh2, .h2 {\n  font-family: var(--font-display);\n  font-size: var(--fs-h2);\n  font-weight: 700;\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tracking-snug);\n  margin: 0;\n}\nh3, .h3 {\n  font-family: var(--font-display);\n  font-size: var(--fs-h3);\n  font-weight: 600;\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tracking-snug);\n  margin: 0;\n}\n\n.display-xl { font-family: var(--font-display); font-size: var(--fs-display-xl); font-weight: 700; line-height: var(--lh-display); letter-spacing: var(--tracking-tight); }\n.display-l  { font-family: var(--font-display); font-size: var(--fs-display-l);  font-weight: 700; line-height: var(--lh-display); letter-spacing: var(--tracking-tight); }\n.display-m  { font-family: var(--font-display); font-size: var(--fs-display-m);  font-weight: 700; line-height: var(--lh-display); letter-spacing: var(--tracking-tight); }\n\n/* The signature \"key word italic\" emphasis. Sharp Sharp italicises\n   the operative noun or question word inside a headline.\n   e.g. Vans: <em>what keeps the brand rolling?<\u002Fem> */\n.accent, em.accent, .display-xl em, .display-l em, .display-m em, h1 em, h2 em {\n  font-style: italic;\n  font-weight: 700;\n  font-variation-settings: \"wdth\" 95;\n}\n\np, .body { font-size: var(--fs-body); line-height: var(--lh-body); margin: 0; }\n.lead    { font-size: var(--fs-lead); line-height: 1.35; }\n.small   { font-size: var(--fs-small); }\n.caption { font-size: var(--fs-caption); letter-spacing: var(--tracking-wide); text-transform: uppercase; }\ncode, .mono { font-family: var(--font-mono); font-size: 0.9em; }\n\n/* ----- The thick rule ----------------------------------------- */\n/* A single thick black line is the recurring divider/structural\n   element across every Sharp Sharp post. Use it for separators,\n   underlines on stats, frames around stat blocks. */\n.rule {\n  border: 0;\n  border-top: var(--rule-w) solid currentColor;\n  margin: 0;\n}\n\n/* ----- Surface helpers ---------------------------------------- */\n.surface-ink  { background: var(--ink);   color: var(--fg-on-ink); }\n.surface-paper{ background: var(--paper); color: var(--fg); }\n<\u002Fstyle>\n<script src=\"168a742d-5e42-4e68-88d9-70ace0b0124f\"><\u002Fscript>\n<script src=\"15d31e0b-96c3-46f0-a3f0-289f65107c05\"><\u002Fscript>\n<style>\n  html, body { margin: 0; height: 100%; }\n  a { color: var(--ink); text-decoration: underline; }\n  a:hover { opacity: 0.7; }\n  input[type=range] { accent-color: #000; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"display: grid; grid-template-columns: {{ gridCols }}; height: 100vh; min-height: 640px; background: var(--paper); font-family: var(--font-body); color: var(--ink); overflow: hidden;\">\n\n  <div style=\"position: relative; background: var(--ink); overflow: hidden;\">\n    <div ref=\"{{ mountRef }}\" style=\"position: absolute; inset: 0;\"><\u002Fdiv>\n    <button sc-camel-on-click=\"{{ toggleChrome }}\" title=\"Esc to show the panel again\" style=\"position: absolute; top: 20px; right: 20px; z-index: 30; appearance: none; border: 1px solid var(--paper-20); background: transparent; color: var(--paper); font-family: var(--font-body); font-size: 12px; padding: 8px 12px; cursor: pointer; border-radius: 0; white-space: nowrap; opacity: {{ chromeToggleOpacity }}; transition: opacity 120ms var(--ease-snap), background 120ms var(--ease-snap), color 120ms var(--ease-snap);\" style-hover=\"opacity: 1; background: var(--paper); color: var(--ink);\">{{ chromeToggleLabel }}<\u002Fbutton>\n    <div style=\"position: absolute; top: 24px; left: 24px; display: {{ chromeDisplay }}; flex-direction: column; gap: 6px; pointer-events: none;\">\n      <div style=\"font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--paper-60);\">Packaging mockup<\u002Fdiv>\n      <div style=\"font-family: var(--font-mono); font-size: 12px; color: var(--paper);\">{{ dimLabel }}<\u002Fdiv>\n      <div style=\"margin-top: 4px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--paper-40);\">Drag to rotate \u00b7 scroll to zoom<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position: absolute; bottom: 20px; left: 24px; right: 24px; display: {{ chromeDisplay }}; flex-wrap: wrap; justify-content: flex-end; align-items: flex-end; gap: 8px;\">\n      <button sc-camel-on-click=\"{{ toggleSpin }}\" style=\"appearance: none; border: 1px solid var(--paper-20); background: transparent; color: var(--paper); font-family: var(--font-body); font-size: 13px; padding: 9px 14px; cursor: pointer; border-radius: 0; display: flex; align-items: center; gap: 8px; flex: 0 0 auto; white-space: nowrap; transition: background 120ms var(--ease-snap), color 120ms var(--ease-snap);\" style-hover=\"background: var(--paper); color: var(--ink);\">\n        <sc-if value=\"{{ spinOn }}\" hint-placeholder-val=\"{{ true }}\">\n          <span style=\"width: 7px; height: 7px; background: currentColor; display: block;\"><\u002Fspan>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ spinOff }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"width: 7px; height: 7px; border: 1px solid currentColor; display: block;\"><\u002Fspan>\n        <\u002Fsc-if>\n        <span>Auto-rotate<\u002Fspan>\n      <\u002Fbutton>\n      <button sc-camel-on-click=\"{{ resetView }}\" style=\"appearance: none; border: 1px solid var(--paper-20); background: transparent; color: var(--paper); font-family: var(--font-body); font-size: 13px; padding: 9px 14px; cursor: pointer; border-radius: 0; flex: 0 0 auto; white-space: nowrap; transition: background 120ms var(--ease-snap), color 120ms var(--ease-snap);\" style-hover=\"background: var(--paper); color: var(--ink);\">Reset view<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ snapshot }}\" style=\"appearance: none; border: 1px solid var(--paper); background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 13px; padding: 9px 14px; cursor: pointer; border-radius: 0; flex: 0 0 auto; white-space: nowrap; transition: opacity 120ms var(--ease-snap);\" style-hover=\"opacity: 0.7;\">Save PNG<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ snapshotAlpha }}\" style=\"appearance: none; border: 1px solid var(--paper); background: transparent; color: var(--paper); font-family: var(--font-body); font-size: 13px; padding: 9px 14px; cursor: pointer; border-radius: 0; flex: 0 0 auto; white-space: nowrap; transition: background 120ms var(--ease-snap), color 120ms var(--ease-snap);\" style-hover=\"background: var(--paper); color: var(--ink);\">Transparent PNG<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border-left: 1px solid var(--hairline); background: var(--paper); overflow-y: auto; display: {{ sidebarDisplay }}; flex-direction: column;\">\n\n    <div style=\"padding: 28px 28px 20px 28px; border-bottom: 3px solid var(--ink);\">\n      <div style=\"font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.05; letter-spacing: -0.03em;\">{{ headerTitle }} <em style=\"font-style: italic;\">{{ headerTitleEm }}<\u002Fem><\u002Fdiv>\n      <div style=\"margin-top: 6px; font-size: 14px; color: var(--ink-60);\">{{ headerBlurb }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding: 24px 28px; border-bottom: 1px solid var(--hairline); display: {{ studioDisplay }}; flex-direction: column; gap: 18px;\">\n      <div style=\"font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-60);\">Dimensions (mm)<\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: x-direction: column; gap: 12px;\">\n      <div style=\"font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-60);\">Artwork for {{ selLabel }}<\u002Fdiv>\n      <div style=\"display: flex; gap: 8px; align-items: center;\">\n        <button sc-camel-on-click=\"{{ pickFile }}\" style=\"appearance: none; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); font-family: var(--font-body); font-size: 14px; padding: 11px 18px; cursor: pointer; border-radius: 0; transition: background 120ms var(--ease-snap), color 120ms var(--ease-snap);\" style-hover=\"background: var(--paper); color: var(--ink);\">Upload image<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-size: 13px; color: var(--ink-60);\">{{ status }}<\u002Fdiv>\n      <hr style=\"border: 0; border-top: 3px solid var(--ink); margin: 6px 0 0 0;\">\n      <div style=\"font-size: 13px; color: var(--ink-60); line-height: 1.45;\">PNG, JPG or WebP. Images stretch to fill their face, so match the artwork to the face proportions.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;finish&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;matte&quot;,&quot;soft&quot;,&quot;silk&quot;,&quot;satin&quot;,&quot;gloss&quot;],&quot;default&quot;:&quot;matte&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Studio&quot;},&quot;lighting&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;neutral&quot;,&quot;packshot&quot;,&quot;softbox&quot;,&quot;dramatic&quot;,&quot;rim&quot;,&quot;flat&quot;],&quot;default&quot;:&quot;packshot&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Studio&quot;},&quot;chamfer&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sharp&quot;,&quot;fine&quot;,&quot;standard&quot;,&quot;soft&quot;],&quot;default&quot;:&quot;standard&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Studio&quot;}}\">\nconst FACES = [\n  { key: 'front', label: 'Front', mat: 4 },\n  { key: 'back', label: 'Back', mat: 5 },\n  { key: 'left', label: 'Left', mat: 1 },\n  { key: 'right', label: 'Right', mat: 0 },\n  { key: 'top', label: 'Top', mat: 2 },\n  { key: 'bottom', label: 'Bottom', mat: 3 },\n];\n\nconst VIEWS = [\n  { key: 'none', label: 'None' },\n  { key: 'front', label: 'Front elevation', orbit: { theta: 0, phi: 1.5708, dist: 8.4 } },\n  { key: 'tq-left', label: 'Three-quarter left', orbit: { theta: -0.68, phi: 1.24, dist: 8.4 } },\n  { key: 'tq-right', label: 'Three-quarter right', orbit: { theta: 0.68, phi: 1.24, dist: 8.4 } },\n  { key: 'side-right', label: 'Right side', orbit: { theta: 1.5708, phi: 1.5708, dist: 8.4 } },\n  { key: 'side-left', label: 'Left side', orbit: { theta: -1.5708, phi: 1.5708, dist: 8.4 } },\n  { key: 'back', label: 'Back elevation', orbit: { theta: 3.1416, phi: 1.5708, dist: 8.4 } },\n  { key: 'top', label: 'Top down', orbit: { theta: 0, phi: 0.24, dist: 8.4 } },\n  { key: 'hero-low', label: 'Low hero angle', orbit: { theta: 0.5, phi: 1.94, dist: 7.6 } },\n  { key: 'detail', label: 'Close detail', orbit: { theta: 0.42, phi: 1.34, dist: 5.2 } },\n];\n\n// Substrate finishes. sheenColor MUST be non-black or `sheen` is a silent no-op.\nconst FINISHES = [\n  { key: 'matte', label: 'Matt laminate',\n    roughness: 0.88, metalness: 0.0, clearcoat: 0.0, clearcoatRoughness: 0.0,\n    sheen: 0.0, sheenRoughness: 1.0, sheenColor: 0x000000,\n    specularIntensity: 0.45, envMapIntensity: 0.35 },\n\n  { key: 'soft', label: 'Soft-touch',\n    roughness: 0.96, metalness: 0.0, clearcoat: 0.08, clearcoatRoughness: 0.85,\n    sheen: 0.3, sheenRoughness: 0.9, sheenColor: 0xb8b8c0,\n    specularIntensity: 0.3, envMapIntensity: 0.26 },\n\n  { key: 'silk', label: 'Silk laminate',\n    roughness: 0.52, metalness: 0.0, clearcoat: 0.28, clearcoatRoughness: 0.55,\n    sheen: 0.5, sheenRoughness: 0.62, sheenColor: 0xf0f0f4,\n    specularIntensity: 0.7, envMapIntensity: 0.72 },\n\n  { key: 'satin', label: 'Satin varnish',\n    roughness: 0.3, metalness: 0.02, clearcoat: 0.55, clearcoatRoughness: 0.28,\n    sheen: 0.18, sheenRoughness: 0.5, sheenColor: 0xffffff,\n    specularIntensity: 0.85, envMapIntensity: 0.95 },\n\n  { key: 'gloss', label: 'Gloss UV',\n    roughness: 0.09, metalness: 0.04, clearcoat: 1.0, clearcoatRoughness: 0.04,\n    sheen: 0.0, sheenRoughness: 0.3, sheenColor: 0x000000,\n    specularIntensity: 1.0, envMapIntensity: 1.4 },\n];\n\n// Reflection environments, prefiltered via PMREMGenerator.fromScene.\n// RoomEnvironment is absent from this Three build, so these are hand-built.\n//\n// Panels are EMISSIVE, not plain colours: MeshBasicMaterial caps at 1.0, so\n// the old panels were only as bright as white paper and gloss had nothing hot\n// to reflect. PMREM captures with tone mapping off into an RGBE target, which\n// is a true HDR format, so emissiveIntensity well above 1 survives.\n//\n// Panels are also smaller and brighter than before. That is deliberate: the\n// environment feeds BOTH diffuse irradiance and specular reflection, so simply\n// turning everything up would wash the matte finishes out. Concentrating the\n// same rough energy into smaller, hotter sources raises specular punch while\n// leaving overall irradiance about where it was.\n//\n// Every panel is aimed at the origin at build time, so no hand-authored\n// rotations to get wrong.\nconst ENVS = {\n  studio: {\n    shell: { color: 0x15151b, i: 0.6 },\n    panels: [\n      { w: 7.0, h: 6.0, color: 0xffffff, i: 7.0, pos: [1.5, 7.5, 4.0] },\n      { w: 1.8, h: 9.0, color: 0xffffff, i: 9.0, pos: [7.0, 3.0, 3.5] },\n      { w: 6.0, h: 5.0, color: 0xd8dff0, i: 1.6, pos: [-7.5, 2.0, 1.0] },\n      { w: 5.0, h: 4.0, color: 0x30343f, i: 1.0, pos: [0, 1.5, -8.0] },\n    ],\n  },\n  even: {\n    shell: { color: 0x3a3a44, i: 0.8 },\n    panels: [\n      { w: 8.0, h: 8.0, color: 0xffffff, i: 4.0, pos: [0, 8.0, 1.0] },\n      { w: 5.5, h: 5.5, color: 0xffffff, i: 3.2, pos: [-6.0, 2.5, 6.0] },\n      { w: 5.5, h: 5.5, color: 0xffffff, i: 3.2, pos: [6.0, 2.5, 6.0] },\n      { w: 6.0, h: 5.0, color: 0x9aa0b0, i: 1.0, pos: [0, 2.0, -8.0] },\n    ],\n  },\n  contrast: {\n    shell: { color: 0x08080b, i: 0.35 },\n    panels: [\n      { w: 2.0, h: 2.0, color: 0xffffff, i: 16.5, pos: [5.0, 8.0, 2.5] },\n      { w: 3.0, h: 3.0, color: 0x6a7080, i: 1.2, pos: [-7.5, 1.0, 1.5] },\n    ],\n  },\n  rimmed: {\n    shell: { color: 0x0e0e13, i: 0.5 },\n    panels: [\n      { w: 2.6, h: 5.5, color: 0xffffff, i: 7.6, pos: [-6.5, 3.5, -6.0] },\n      { w: 2.6, h: 5.5, color: 0xeaf0ff, i: 8.0, pos: [6.5, 3.5, -6.0] },\n      { w: 5.0, h: 4.0, color: 0x282c36, i: 1.0, pos: [0, 1.5, 7.5] },\n      { w: 6.0, h: 6.0, color: 0x1a1d24, i: 1.0, pos: [0, 8.0, 0] },\n    ],\n  },\n};\n\n// Lighting rigs. RectAreaLight is unusable in this build (no\n// RectAreaLightUniformsLib), so softboxes are Directional + the env map.\n// role decides which lights the contrast control pushes apart: 'key' rises\n// with contrast, 'fill' falls. tone:false disables tone mapping, env:null\n// disables reflections.\nconst LIGHTING = [\n  { key: 'neutral', label: 'Neutral (original)', env: null, tone: false, exposure: 1.0, shadow: 0.35,\n    lights: [\n      { t: 'hemi', sky: 0xffffff, ground: 0x2a2a2a, i: 0.55, role: 'fill' },\n      { t: 'dir', color: 0xffffff, i: 0.85, pos: [4, 7, 6], shadow: true, role: 'key' },\n      { t: 'dir', color: 0xffffff, i: 0.3, pos: [-6, 2, -4], role: 'fill' },\n      { t: 'amb', color: 0xffffff, i: 0.22, role: 'fill' },\n    ] },\n\n  { key: 'packshot', label: 'Pack shot studio', env: 'studio', exposure: 1.05, shadow: 0.28,\n    lights: [\n      { t: 'hemi', sky: 0xffffff, ground: 0x505058, i: 0.45, role: 'fill' },\n      { t: 'dir', color: 0xffffff, i: 1.25, pos: [4, 7, 6], shadow: true, role: 'key' },\n      { t: 'dir', color: 0xdfe6ff, i: 0.45, pos: [-6, 3, -4], role: 'fill' },\n      { t: 'dir', color: 0xffffff, i: 0.35, pos: [0, 9, 0], role: 'fill' },\n      { t: 'amb', color: 0xffffff, i: 0.12, role: 'fill' },\n    ] },\n\n  { key: 'softbox', label: 'Twin softbox', env: 'even', exposure: 1.1, shadow: 0.2,\n    lights: [\n      { t: 'hemi', sky: 0xffffff, ground: 0x606068, i: 0.5, role: 'fill' },\n      { t: 'dir', color: 0xffffff, i: 1.0, pos: [6, 4, 7], shadow: true, role: 'key' },\n      { t: 'dir', color: 0xffffff, i: 0.9, pos: [-6, 4, 7], role: 'fill' },\n      { t: 'dir', color: 0xe8ecff, i: 0.3, pos: [0, 6, -6], role: 'fill' },\n      { t: 'amb', color: 0xffffff, i: 0.18, role: 'fill' },\n    ] },\n\n  { key: 'dramatic', label: 'Dramatic spotlit', env: 'contrast', exposure: 1.0, shadow: 0.55,\n    lights: [\n      { t: 'spot', color: 0xffffff, i: 3.2, pos: [4, 9, 3], angle: 0.42, penumbra: 0.35, shadow: true, role: 'key' },\n      { t: 'dir', color: 0x8fa8ff, i: 0.5, pos: [-5, 2, -5], role: 'fill' },\n      { t: 'hemi', sky: 0x6a6a78, ground: 0x000000, i: 0.08, role: 'fill' },\n      { t: 'amb', color: 0xffffff, i: 0.04, role: 'fill' },\n    ] },\n\n  { key: 'rim', label: 'Rim / edge light', env: 'rimmed', exposure: 1.05, shadow: 0.4,\n    lights: [\n      { t: 'dir', color: 0xffffff, i: 1.6, pos: [-5, 4, -6], role: 'key' },\n      { t: 'dir', color: 0xeaf0ff, i: 1.4, pos: [5, 3, -6], role: 'key' },\n      { t: 'dir', color: 0xffffff, i: 0.25, pos: [0, 2, 7], shadow: true, role: 'fill' },\n      { t: 'amb', color: 0xffffff, i: 0.06, role: 'fill' },\n    ] },\n\n  { key: 'flat', label: 'Flat catalogue', env: 'even', exposure: 1.0, shadow: 0.12,\n    lights: [\n      { t: 'hemi', sky: 0xffffff, ground: 0x9a9aa2, i: 0.8, role: 'fill' },\n      { t: 'dir', color: 0xffffff, i: 0.7, pos: [2, 8, 5], shadow: true, role: 'key' },\n      { t: 'dir', color: 0xffffff, i: 0.6, pos: [-3, 5, 4], role: 'fill' },\n      { t: 'amb', color: 0xffffff, i: 0.35, role: 'fill' },\n    ] },\n];\n\n// Fold radius, in mm of real carton. A folded board edge is never a true 90\n// degree corner; the chamfer gives it a highlight to catch, which is what\n// separates the faces visually instead of a drawn outline.\nconst CHAMFERS = [\n  { key: 'sharp', label: 'Sharp (no fold)', mm: 0 },\n  { key: 'fine', label: 'Fine fold', mm: 0.7 },\n  { key: 'standard', label: 'Standard fold', mm: 1.4 },\n  { key: 'soft', label: 'Soft fold', mm: 2.6 },\n];\n\n// Chamfered box with the SAME six material groups and the SAME per-face UV\n// convention as THREE.BoxGeometry, so existing face artwork is unaffected.\n// Built by hand because RoundedBoxGeometry lives in examples/jsm, which is\n// not part of this Three build.\nfunction makeBoxGeometry(T, w, h, d, c) {\n  const A = w / 2, B = h / 2, C = d / 2;\n  c = Math.max(0, Math.min(c, Math.min(A, B, C) * 0.45));\n  if (c < 1e-6) return new T.BoxGeometry(w, h, d);\n\n  const ia = A - c, ib = B - c, ic = C - c;\n\n  // Verified against BoxGeometry across multiple sizes.\n  const UVF = [\n    (x, y, z) => [(C - z) / (2 * C), (y + B) / (2 * B)],\n    (x, y, z) => [(z + C) / (2 * C), (y + B) / (2 * B)],\n    (x, y, z) => [(x + A) / (2 * A), (C - z) / (2 * C)],\n    (x, y, z) => [(x + A) / (2 * A), (z + C) / (2 * C)],\n    (x, y, z) => [(x + A) / (2 * A), (y + B) / (2 * B)],\n    (x, y, z) => [(A - x) / (2 * A), (y + B) / (2 * B)],\n  ];\n\n  const buckets = [[], [], [], [], [], []];\n\n  // Winding is derived from the expected outward normal rather than assumed,\n  // which removes any chance of an inside-out face.\n  function tri(mat, p, q, r, n) {\n    const ux = q[0] - p[0], uy = q[1] - p[1], uz = q[2] - p[2];\n    const vx = r[0] - p[0], vy = r[1] - p[1], vz = r[2] - p[2];\n    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;\n    if (nx * n[0] + ny * n[1] + nz * n[2] < 0) buckets[mat].push(p, r, q);\n    else buckets[mat].push(p, q, r);\n  }\n  function quad(mat, p0, p1, p2, p3, n) { tri(mat, p0, p1, p2, n); tri(mat, p0, p2, p3, n); }\n\n  const S = [1, -1];\n\n  // Six inset faces.\n  S.forEach((sx) => quad(sx > 0 ? 0 : 1,\n    [sx * A, -ib, -ic], [sx * A, ib, -ic], [sx * A, ib, ic], [sx * A, -ib, ic], [sx, 0, 0]));\n  S.forEach((sy) => quad(sy > 0 ? 2 : 3,\n    [-ia, sy * B, -ic], [ia, sy * B, -ic], [ia, sy * B, ic], [-ia, sy * B, ic], [0, sy, 0]));\n  S.forEach((sz) => quad(sz > 0 ? 4 : 5,\n    [-ia, -ib, sz * C], [ia, -ib, sz * C], [ia, ib, sz * C], [-ia, ib, sz * C], [0, 0, sz]));\n\n  // Twelve edge chamfers. Each is split along its midline so both halves carry\n  // the artwork of the face they adjoin \u2014 otherwise the bevel renders as bare\n  // substrate and you get a pale hairline exactly where the black one was.\n  S.forEach((sx) => S.forEach((sy) => {\n    const n = [sx * 0.7071, sy * 0.7071, 0];\n    const my = sy * (ib + B) / 2, mx = sx * (A + ia) / 2;\n    quad(sx > 0 ? 0 : 1, [sx * A, sy * ib, -ic], [sx * A, sy * ib, ic], [mx, my, ic], [mx, my, -ic], n);\n    quad(sy > 0 ? 2 : 3, [mx, my, -ic], [mx, my, ic], [sx * ia, sy * B, ic], [sx * ia, sy * B, -ic], n);\n  }));\n  S.forEach((sy) => S.forEach((sz) => {\n    const n = [0, sy * 0.7071, sz * 0.7071];\n    const my = sy * (B + ib) / 2, mz = sz * (ic + C) / 2;\n    quad(sy > 0 ? 2 : 3, [-ia, sy * B, sz * ic], [ia, sy * B, sz * ic], [ia, my, mz], [-ia, my, mz], n);\n    quad(sz > 0 ? 4 : 5, [-ia, my, mz], [ia, my, mz], [ia, sy * ib, sz * C], [-ia, sy * ib, sz * C], n);\n  }));\n  S.forEach((sx) => S.forEach((sz) => {\n    const n = [sx * 0.7071, 0, sz * 0.7071];\n    const mx = sx * (A + ia) / 2, mz = sz * (ic + C) / 2;\n    quad(sx > 0 ? 0 : 1, [sx * A, -ib, sz * ic], [sx * A, ib, sz * ic], [mx, ib, mz], [mx, -ib, mz], n);\n    quad(sz > 0 ? 4 : 5, [mx, -ib, mz], [mx, ib, mz], [sx * ia, ib, sz * C], [sx * ia, -ib, sz * C], n);\n  }));\n\n  // Eight corners. The gap left by three meeting chamfers is a single flat\n  // triangle; it is split at its centroid so each third takes its own face.\n  const mid = (u, v) => [(u[0] + v[0]) / 2, (u[1] + v[1]) / 2, (u[2] + v[2]) / 2];\n  S.forEach((sx) => S.forEach((sy) => S.forEach((sz) => {\n    const Pa = [sx * A, sy * ib, sz * ic], mA = sx > 0 ? 0 : 1;\n    const Pb = [sx * ia, sy * B, sz * ic], mB = sy > 0 ? 2 : 3;\n    const Pc = [sx * ia, sy * ib, sz * C], mC = sz > 0 ? 4 : 5;\n    const G = [(Pa[0] + Pb[0] + Pc[0]) / 3, (Pa[1] + Pb[1] + Pc[1]) / 3, (Pa[2] + Pb[2] + Pc[2]) / 3];\n    const Mab = mid(Pa, Pb), Mbc = mid(Pb, Pc), Mca = mid(Pc, Pa);\n    const n = [sx, sy, sz];\n    tri(mA, Pa, Mab, G, n); tri(mA, Pa, G, Mca, n);\n    tri(mB, Pb, Mbc, G, n); tri(mB, Pb, G, Mab, n);\n    tri(mC, Pc, Mca, G, n); tri(mC, Pc, G, Mbc, n);\n  })));\n\n  const positions = [], uvs = [];\n  const geo = new T.BufferGeometry();\n  let start = 0;\n  for (let m = 0; m < 6; m++) {\n    const b = buckets[m];\n    for (let i = 0; i < b.length; i++) {\n      const p = b[i];\n      positions.push(p[0], p[1], p[2]);\n      const t = UVF[m](p[0], p[1], p[2]);\n      uvs.push(t[0], t[1]);\n    }\n    geo.addGroup(start, b.length, m);\n    start += b.length;\n  }\n  geo.setAttribute('position', new T.Float32BufferAttribute(positions, 3));\n  geo.setAttribute('uv', new T.Float32BufferAttribute(uvs, 2));\n  // Non-indexed, so this yields flat per-triangle normals \u2014 the chamfer keeps\n  // a crisp specular band instead of smearing into the faces.\n  geo.computeVertexNormals();\n  return geo;\n}\n\nconst SWATCHES = [\n  { key: 'ink', label: 'Ink', hex: '#000000' },\n  { key: 'nearblack', label: 'Near black', hex: '#14141A' },\n  { key: 'charcoal', label: 'Charcoal', hex: '#2B2B33' },\n  { key: 'slate', label: 'Slate', hex: '#55555D' },\n  { key: 'midgrey', label: 'Mid grey', hex: '#8A8A93' },\n  { key: 'lightgrey', label: 'Light grey', hex: '#C9C9D0' },\n  { key: 'paper', label: 'Paper', hex: '#F2F2F2' },\n  { key: 'white', label: 'White', hex: '#FFFFFF' },\n  { key: 'sand', label: 'Warm sand', hex: '#E8E2D9' },\n  { key: 'navy', label: 'Deep navy', hex: '#1E2A38' },\n];\n\nconst HEX_RE = /^#?([0-9
